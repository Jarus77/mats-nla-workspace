[project]
name = "workspace-bench"
version = "0.1.0"
description = "workspace-bench: evals of whether an activation-reading lens surfaces what a model computes but never writes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["openai>=1.40", "anthropic>=1.0", "numpy>=1.26", "pydra-config>=0.0.17"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gpu = ["torch>=2.4", "transformers>=5", "peft>=0.14", "huggingface_hub", "accelerate", "pyyaml"]

[project.scripts]
wsbench = "wsbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
